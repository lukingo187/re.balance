# re.balance configuration — a starting point.
#   cp config.example.toml config.toml
# After this, manage it through the CLI (add, rm, edit, settings, freeze,
# unfreeze) rather than by hand — those rewrite the file and do not keep comments.
# Your real config.toml and state.json are gitignored: they hold personal
# portfolio data and should not be committed.
#
# Current market values are NOT here; set them with 'rebal set <ISIN> <value>'.

[settings]
monthly_total       = 400   # euros/month, total across all savings plans
default_min_monthly = 25    # broker minimum per plan; per-position override below
horizon_months      = 12    # default horizon
tolerance_pp        = 0.5   # convergence = max drift within this many percentage points
max_horizon         = 36    # sweep upper bound

[[positions]]
name   = "MSCI World"
isin   = "IE00B4L5Y983"
target = 50

[[positions]]
name        = "MSCI EM IMI"
isin        = "IE00BKM4GZ66"
target      = 30
min_monthly = 50   # optional override of default_min_monthly

[[positions]]
name   = "Europe Small Cap"
isin   = "IE00B3VWMM18"
target = 20

# A position you want to hold but stop buying is a wind-down position
# (wind_down = true, no target). Add one with 'rebal freeze <ISIN>'; the freed
# target is redistributed so the remaining targets still sum to 100.
# [[positions]]
# name      = "Old Tech Fund"
# isin      = "IE00EXAMPLE00"
# wind_down = true
